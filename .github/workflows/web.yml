name: Deploy web app

# Builds the web app / PWA and publishes it to Cloudflare Pages.
# Runs on every push to main that touches the app or shared code, or by hand: Actions > Deploy web app > Run workflow.
# Until the Cloudflare secrets exist (see docs/APP.md > Hosting the web app) it does nothing and says so.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/app/**"
      - "packages/**"
      - "scripts/postbuild-web.mjs"
      - ".github/workflows/web.yml"

concurrency:
  group: web-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'learning-log' }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_DEV_PASSWORD_LOGIN: "0"
      EXPO_PUBLIC_BUILD: ${{ github.sha }}
      EXPO_PUBLIC_VAPID_PUBLIC_KEY: ${{ vars.EXPO_PUBLIC_VAPID_PUBLIC_KEY }}
      EXPO_PUBLIC_GOOGLE_SIGNIN: ${{ vars.EXPO_PUBLIC_GOOGLE_SIGNIN }}
    steps:
      - name: Check the hosting settings are present
        id: cfg
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Skipped: add the secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to publish the web app (docs/APP.md > Hosting the web app)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$EXPO_PUBLIC_SUPABASE_URL" ] || [ -z "$EXPO_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "::error::Set the repository variables EXPO_PUBLIC_SUPABASE_URL and EXPO_PUBLIC_SUPABASE_ANON_KEY (Settings > Secrets and variables > Actions > Variables)."
            exit 1
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ok == 'true'
      - uses: pnpm/action-setup@v4
        if: steps.cfg.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.ok == 'true'
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        if: steps.cfg.outputs.ok == 'true'

      - name: Build the web app
        if: steps.cfg.outputs.ok == 'true'
        run: pnpm --filter @learning-log/app export:web

      - name: Create the Cloudflare Pages project (first run only)
        if: steps.cfg.outputs.ok == 'true'
        run: |
          pnpm dlx wrangler@4 pages project create "$PAGES_PROJECT" --production-branch main \
            || echo "Project already exists, continuing"

      - name: Publish
        if: steps.cfg.outputs.ok == 'true'
        run: pnpm dlx wrangler@4 pages deploy apps/app/dist --project-name "$PAGES_PROJECT" --branch main --commit-dirty=true
