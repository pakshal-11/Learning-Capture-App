name: Build Android APK

# Run it from GitHub: Actions > Build Android APK > Run workflow. The APK appears under "Artifacts" when it finishes.
on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_DEV_PASSWORD_LOGIN: "0"
      EXPO_PUBLIC_BUILD: ${{ github.sha }}
      EXPO_PUBLIC_GOOGLE_SIGNIN: ${{ vars.EXPO_PUBLIC_GOOGLE_SIGNIN }}
      EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: pnpm install --frozen-lockfile

      - name: Check the build settings are present
        run: |
          test -n "$EXPO_PUBLIC_SUPABASE_URL" || { echo "Set the repository variable EXPO_PUBLIC_SUPABASE_URL (Settings > Secrets and variables > Actions > Variables)"; exit 1; }
          test -n "$EXPO_PUBLIC_SUPABASE_ANON_KEY" || { echo "Set the repository variable EXPO_PUBLIC_SUPABASE_ANON_KEY"; exit 1; }

      - name: Firebase file (optional, for notifications)
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > apps/app/google-services.json; fi

      - name: Generate the Android project
        working-directory: apps/app
        run: pnpm exec expo prebuild --platform android --no-install

      - name: Build the APK
        working-directory: apps/app/android
        run: ./gradlew assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"

      - uses: actions/upload-artifact@v4
        with:
          name: learning-log-apk
          path: apps/app/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
