name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - run: pnpm install --frozen-lockfile

      - name: Unit tests (scheduling + streak logic)
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

      - name: Shared core copies match the source of truth
        run: node scripts/sync-core.mjs --check

      - name: Typecheck Edge Functions
        working-directory: supabase/functions
        run: deno check --no-config --node-modules-dir=auto */index.ts
